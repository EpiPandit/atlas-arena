name: Build and Publish Arena Site

# Production deploy. Staging is deployed by hand with web_app/deploy-staging.sh,
# which this mirrors.

on:
  push:
    branches:
      - "main"
      - "deploy"

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Corepack provides the Yarn version from package.json's packageManager
      # field; it has to be enabled before setup-node can cache with yarn.
      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: web_app/.nvmrc
          cache: yarn
          cache-dependency-path: web_app/yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Hashed build assets never change, so cache them for a year; everything
      # else (HTML, markdown, data) is revalidated on every request. cogs/ is
      # excluded from --delete in case rasters are ever hosted in this bucket.
      - name: Upload to S3
        env:
          BUCKET: ${{ secrets.ARENA_S3_BUCKET }}
        run: |
          aws s3 sync --only-show-errors out/_next/static "s3://$BUCKET/_next/static" \
            --acl public-read \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync --only-show-errors out/ "s3://$BUCKET/" --delete \
            --acl public-read \
            --exclude "_next/static/*" \
            --exclude "cogs/*" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        env:
          DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" --query "Invalidation.Id" --output text
