name: Build and Publish Arena Site

# A push to "staging" deploys the staging site, built against the dev backend.
# A push to "main" deploys production, built against the prod backend.
# (web_app/deploy-staging.sh does the staging deploy by hand, if ever needed.)
#
# Repository settings this needs (Settings > Secrets and variables > Actions):
#
#   Secrets, both sites:  AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   Secrets, production:  ARENA_S3_BUCKET, CLOUDFRONT_DISTRIBUTION_ID
#   Variables, production:
#     ATLASARENA_API_URL, ATLASARENA_JOBS_URL, ATLASARENA_DATA_URL
#   Variables, staging:
#     STAGING_ATLASARENA_API_URL, STAGING_ATLASARENA_JOBS_URL,
#     STAGING_ATLASARENA_DATA_URL, STAGING_ARENA_S3_BUCKET,
#     STAGING_CLOUDFRONT_DISTRIBUTION_ID
#
# The three URLs are CloudFormation outputs of the atlasarena-model-infra
# stacks (ApiUrl, JobsPublicUrl, DataPublicUrl): AtlasArenaProdStack for
# production, AtlasArenaDevStack for staging. Each must end in "/".

on:
  push:
    branches:
      - "main"
      - "staging"

# One deploy at a time per site; a staging run never cancels a production run.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Each value is picked by branch here, so the steps are the same for both
    # sites. A staging run can never resolve to a production value.
    env:
      IS_PROD: ${{ github.ref_name == 'main' }}
      NEXT_PUBLIC_ATLASARENA_API_URL: ${{ github.ref_name == 'main' && vars.ATLASARENA_API_URL || vars.STAGING_ATLASARENA_API_URL }}
      NEXT_PUBLIC_ATLASARENA_JOBS_URL: ${{ github.ref_name == 'main' && vars.ATLASARENA_JOBS_URL || vars.STAGING_ATLASARENA_JOBS_URL }}
      NEXT_PUBLIC_ATLASARENA_DATA_URL: ${{ github.ref_name == 'main' && vars.ATLASARENA_DATA_URL || vars.STAGING_ATLASARENA_DATA_URL }}
      BUCKET: ${{ github.ref_name == 'main' && secrets.ARENA_S3_BUCKET || vars.STAGING_ARENA_S3_BUCKET }}
      DISTRIBUTION_ID: ${{ github.ref_name == 'main' && secrets.CLOUDFRONT_DISTRIBUTION_ID || vars.STAGING_CLOUDFRONT_DISTRIBUTION_ID }}
    defaults:
      run:
        working-directory: web_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Corepack provides the Yarn version from package.json's packageManager
      # field; it has to be enabled before setup-node can cache with yarn.
      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: web_app/.nvmrc
          cache: yarn
          cache-dependency-path: web_app/yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      # A missing setting would otherwise build a site with empty URLs, or, on
      # main, fall through to the staging value and build production against
      # the dev backend, in both cases without any error.
      - name: Check settings
        env:
          PROD_SETTINGS_PRESENT: ${{ vars.ATLASARENA_API_URL != '' && vars.ATLASARENA_JOBS_URL != '' && vars.ATLASARENA_DATA_URL != '' && secrets.ARENA_S3_BUCKET != '' && secrets.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          if [ "$IS_PROD" = "true" ] && [ "$PROD_SETTINGS_PRESENT" != "true" ]; then
            echo "::error::A production variable or secret is not set. See the list at the top of .github/workflows/deploy.yaml."
            exit 1
          fi
          for name in NEXT_PUBLIC_ATLASARENA_API_URL NEXT_PUBLIC_ATLASARENA_JOBS_URL \
            NEXT_PUBLIC_ATLASARENA_DATA_URL BUCKET DISTRIBUTION_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty: a repository variable for this branch is not set. See the list at the top of .github/workflows/deploy.yaml."
              exit 1
            fi
          done

      - name: Build
        run: yarn build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Hashed build assets never change, so cache them for a year; everything
      # else (HTML, markdown, data) is revalidated on every request. cogs/ is
      # excluded from --delete in case rasters are ever hosted in this bucket.
      # The production bucket serves objects through a public-read ACL; the
      # staging bucket is read through CloudFront only and takes no ACL.
      - name: Upload to S3
        run: |
          acl=()
          if [ "$IS_PROD" = "true" ]; then acl=(--acl public-read); fi
          aws s3 sync --only-show-errors out/_next/static "s3://$BUCKET/_next/static" \
            "${acl[@]}" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync --only-show-errors out/ "s3://$BUCKET/" --delete \
            "${acl[@]}" \
            --exclude "_next/static/*" \
            --exclude "cogs/*" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" --query "Invalidation.Id" --output text
